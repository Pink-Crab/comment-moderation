name: E2E Tests

on:
  pull_request:
    branches: [ main, master, develop, trunk ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Build admin Elm bundle
        run: npm run build:elm

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Start wp-env
        run: npx wp-env start

      - name: Pre-test wp-env diagnostics
        run: |
          set +e
          echo "=== WP core version ==="
          npx wp-env run cli wp core version
          echo
          echo "=== Active plugins ==="
          npx wp-env run cli wp plugin list --status=active --format=table
          echo
          echo "=== All plugins (any status) ==="
          npx wp-env run cli wp plugin list --format=table
          echo
          echo "=== Administrator users ==="
          npx wp-env run cli wp user list --role=administrator --fields=ID,user_login,user_email,roles --format=table
          echo
          echo "=== Plugin bootstrap reachable ==="
          npx wp-env run cli wp eval 'echo class_exists("PinkCrab\\Comment_Moderation\\Plugin_Bootstrap") ? "Plugin_Bootstrap class loaded\n" : "Plugin_Bootstrap MISSING\n";'
          echo
          echo "=== Direct curl: unauth GET on options-general?page=pinkcrab-comment-moderation ==="
          curl -sS -o /tmp/curl-page.html -w "HTTP %{http_code}  size=%{size_download}\n" "http://localhost:57881/wp-admin/options-general.php?page=pinkcrab-comment-moderation"
          echo "---first 40 lines---"
          head -40 /tmp/curl-page.html
          echo
          echo "=== wp-env error log tail (pre-test) ==="
          timeout 15 npx wp-env logs --debug 2>&1 | grep -iE "fatal|warning|notice|deprecated|error" | tail -40 || true
          true

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          WP_BASE_URL: http://localhost:57881
          WP_USERNAME: admin
          WP_PASSWORD: password

      - name: wp-env logs (on failure)
        if: failure()
        run: timeout 20 npx wp-env logs --debug 2>&1 | tail -200 || true

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
