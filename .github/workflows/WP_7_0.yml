name: WordPress 7.0 Test Suite [PHP8.0-8.5]

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest]
        php-versions: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    runs-on: ${{ matrix.operating-system }}
    services:
      mysql-service:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: 'root'
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect || mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=10

    env:
      environment_github: true

    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, intl, pcov, mysqli
          ini-values: post_max_size=256M, log_errors=1
          tools: pecl

      - name: Check PHP Version
        run: php -v

      - name: Clear existing composer
        run: >
          sudo rm -rf vendor
          && rm -rf composer.lock
      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install dependencies
        run: >
          rm -rf composer.lock
          && composer clearcache
          && composer require php-stubs/wordpress-stubs:7.0.* --dev --no-update
          && composer require roots/wordpress:7.0.* --dev --no-update
          && composer require wp-phpunit/wp-phpunit:7.0.* --dev --no-update
          && composer update --no-cache

      - name: phpcs
        run: composer lint:php:phpcs

      - name: phpstan
        run: composer lint:php:phpstan

      - name: phpmd
        run: composer lint:php:phpmd

      - name: phpunit
        run: composer coverage
