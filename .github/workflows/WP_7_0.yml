name: WP 7.0 (PHP 8.0-8.3)

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - trunk

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2', '8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      environment_github: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: xdebug
          extensions: mysqli

      - name: Pin WordPress to 7.0
        run: composer require --dev --no-update "roots/wordpress:7.0.*" "wp-phpunit/wp-phpunit:7.0.*"

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: '--ignore-platform-reqs --no-interaction'

      - name: PHP syntax check (lint)
        run: find . -path ./vendor -prune -o -path ./node_modules -prune -o -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: phpcs
        run: composer lint:php:phpcs

      - name: phpstan
        run: composer lint:php:phpstan

      - name: phpmd
        run: composer lint:php:phpmd

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -uroot -proot --silent && break
            sleep 1
          done

      - name: Run PHPUnit
        run: composer coverage
