name: JS Build

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - trunk

jobs:
  build:
    name: Node ${{ matrix.node }} — lint + build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint JS
        run: npm run lint:scripts

      - name: Lint styles
        run: npm run lint:styles

      - name: Build
        run: npm run build

      - name: Verify build output exists
        run: test -f assets/js/admin.js
